[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickyantra"
version = "2.0.0"
description = "SLO-aware, prefix-affinity control plane for low-latency SGLang inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ritwij Parmar" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[project.scripts]
tickyantra = "tickyantra.main:main"
tickbench = "bench.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tickyantra*", "bench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
